name: CI - Build & Test Suite

on:
  push:
    branches: [main, master, fix/credibility-gap]
  pull_request:
    branches: [main, master]

jobs:
  python-scheduler-tests:
    name: Python Scheduler Tests (original)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Core Scheduler Tests
        run: |
          uv sync
          uv run python python_core/test_runner.py all

  python-backend-tests:
    name: Backend pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Backend Tests
        run: |
          uv sync --extra dev
          uv run pytest backend/tests/ -v

  frontend-build-and-test:
    name: React 19 Frontend — Build + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Tests
        working-directory: ./frontend
        run: npm test

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build
